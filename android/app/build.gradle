apply plugin: 'com.android.application'

android {
    namespace "com.danielstrass.darttrainer"
    compileSdk rootProject.ext.compileSdkVersion

    // Release-Signatur kommt NIE aus dem Repo. Quellen (erste vorhandene gewinnt):
    //   1. Umgebungsvariable DT_SIGNING_PROPERTIES = Pfad zu einer Properties-Datei
    //   2. android/signing.properties (in .gitignore; ueblicherweise Symlink auf
    //      ~/secure/darttrainer/signing-old.properties bzw. signing-new.properties)
    //   3. Umgebungsvariablen DT_STORE_FILE, DT_STORE_PASSWORD, DT_KEY_ALIAS, DT_KEY_PASSWORD
    // Vorlage: android/signing.properties.example
    def signingProps = new Properties()
    def signingSource = null
    def propsPath = System.getenv('DT_SIGNING_PROPERTIES')
    def propsFile = propsPath ? file(propsPath) : rootProject.file('signing.properties')
    if (propsFile.exists()) {
        propsFile.withInputStream { signingProps.load(it) }
        signingSource = propsFile.canonicalPath
    } else if (System.getenv('DT_STORE_FILE')) {
        signingProps.storeFile = System.getenv('DT_STORE_FILE')
        signingProps.storePassword = System.getenv('DT_STORE_PASSWORD') ?: ''
        signingProps.keyAlias = System.getenv('DT_KEY_ALIAS') ?: ''
        signingProps.keyPassword = System.getenv('DT_KEY_PASSWORD') ?: ''
        signingSource = 'env DT_STORE_FILE'
    } else if (propsPath) {
        throw new GradleException("DT_SIGNING_PROPERTIES zeigt auf ${propsPath}, die Datei existiert nicht")
    }

    signingConfigs {
        if (signingSource) {
            release {
                storeFile file(signingProps.storeFile)
                storePassword signingProps.storePassword
                keyAlias signingProps.keyAlias
                keyPassword signingProps.keyPassword
            }
        }
    }

    defaultConfig {
        applicationId "com.danielstrass.darttrainer"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 13
        versionName "1.3.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    buildTypes {
        release {
            if (signingSource) signingConfig signingConfigs.release
            minifyEnabled false
        }
        debug {
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    // Firebase App Check — Play Integrity (only valid for apps distributed via Play Store)
    implementation 'com.google.firebase:firebase-appcheck-playintegrity:18.0.0'
    implementation 'com.google.firebase:firebase-appcheck-debug:18.0.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}

// Release-Builds ohne Signaturquelle sofort mit klarer Meldung abbrechen
// (statt still ein unsigniertes AAB zu erzeugen). Debug/Sync bleiben unberuehrt.
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { it.project == project && it.name ==~ /(bundle|assemble|package|sign)Release.*/ }
    if (wantsRelease) {
        if (!android.signingConfigs.findByName('release')) {
            throw new GradleException("Keine Release-Signatur konfiguriert: android/signing.properties anlegen (Vorlage: signing.properties.example) oder DT_SIGNING_PROPERTIES / DT_STORE_FILE setzen.")
        }
        logger.lifecycle("Release-Signatur: alias=${android.signingConfigs.release.keyAlias}, keystore=${android.signingConfigs.release.storeFile}")
    }
}
